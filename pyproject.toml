[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoomer"
version = "0.1.0"
description = "Control zoom and scroll in any PDF viewer with thumb-and-index hand gestures."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The zoomer contributors" }]
keywords = ["mediapipe", "hand-tracking", "gestures", "pdf", "accessibility", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pynput>=1.7.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/zoomer-project/zoomer"
Source = "https://github.com/zoomer-project/zoomer"
Issues = "https://github.com/zoomer-project/zoomer/issues"
Changelog = "https://github.com/zoomer-project/zoomer/blob/main/CHANGELOG.md"

[project.scripts]
zoomer = "zoomer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zoomer"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config -m 'not hardware'"
markers = [
    "hardware: touches a real camera, model download, or desktop session; run with -m hardware",
]

[tool.coverage.run]
source = ["zoomer"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH", "RET"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# Null-object and protocol implementations must mirror the declared signature
# exactly, so their unused parameters are load-bearing rather than dead.
"src/zoomer/hud.py" = ["ARG002"]

[tool.mypy]
python_version = "3.11"
packages = ["zoomer"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "pynput.*"]
ignore_missing_imports = true
